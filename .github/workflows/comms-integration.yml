name: Comms integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  viewer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Shell validation
        run: bash -n build.sh install.sh scripts/bundle-comms.sh scripts/install-local-comms.sh
      - name: Client contract and process isolation
        run: |
          swiftc CommsNodeClient.swift scripts/validate-comms-client.swift -o /tmp/validate-comms-client
          /tmp/validate-comms-client
      - name: Codex wake lifecycle and transcript watching
        run: |
          swiftc -D AGENT_MONITOR_TESTS -parse-as-library AgentMonitor.swift CommsNodeClient.swift CommsNodeViews.swift scripts/validate-codex-wake.swift -o /tmp/validate-codex-wake -framework SwiftUI -framework AppKit -framework Carbon -framework UserNotifications
          /tmp/validate-codex-wake
      - name: Release integrity without private credentials
        run: python3 scripts/test-comms-bundle.py
      - name: Migrated skill executable resolution
        run: python3 scripts/test_installed_skill.py
      - name: Private service-key file installer arguments
        run: python3 scripts/test_comms_install_options.py
      - name: Compile GUI without private release access
        env:
          COMMS_SKIP_BUNDLE: '1'
          NO_LAUNCH: '1'
          ADHOC_SIGN: '1'
        run: ./build.sh
